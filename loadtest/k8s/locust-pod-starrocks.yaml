# locust-pod.yaml의 starrocks 전용 버전 — VECTOR_BACKEND=starrocks를 파드 env에
# 박아둬서, 자동 준비 스크립트(seed_collection.py)와 이후 locust 실행이 손대지
# 않아도 항상 starrocks를 타게 한다(milvus 쪽과 리소스/네임스페이스를 분리해서
# 따로 띄우고 싶을 때 사용 — 예: user-x0179564-starrocks-loadtest).
#
# 사전 준비: starrocks를 먼저(또는 이 파드와 거의 동시에) 배포해둘 것
#   kubectl apply -f loadtest/k8s/starrocks.yaml -n <namespace>
#
# 실행: kubectl apply -f loadtest/k8s/locust-pod-starrocks.yaml -n <namespace>
#   (loadtest/k8s/rbac.yaml, pvc.yaml이 먼저 적용되어 있어야 함)
# 준비 완료 확인: kubectl logs locust-loadtest -n <namespace>  ("[entrypoint] 준비 완료" 나오면 끝)
# 접속: kubectl exec -it locust-loadtest -n <namespace> -- /bin/sh
#
#   # 웹 UI 모드로 직접 클릭하며 확인 (User count/Spawn rate를 브라우저에서 입력)
#   $ locust -f milvus_migration/loadtest/locustfile_baseline.py --web-host 0.0.0.0
#   (다른 터미널에서) kubectl port-forward pod/locust-loadtest 8089:8089 -n <namespace>
#   브라우저로 localhost:8089 접속
#
# 나머지 사용법(headless 테스트 A/B, 리포트, 결과 가져오기)은 locust-pod.yaml과 동일.
# 삭제: kubectl delete pod locust-loadtest -n <namespace>
apiVersion: v1
kind: Pod
metadata:
  name: locust-loadtest
  labels:
    app: locust-loadtest
spec:
  restartPolicy: Never
  serviceAccountName: loadtest-runner
  containers:
    - name: locust-loadtest
      image: ghcr.io/seongwonm/ard-milvus-loadtest:c8c0b277bd4a05ee84c100371f0e575cffd4bf3e
      imagePullPolicy: Always
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -x
          python -m milvus_migration.loadtest.cache_query_vectors --data-root /data
          python -m milvus_migration.loadtest.cache_chunk_vectors --data-root /data
          for i in $(seq 1 60); do
            python -m milvus_migration.loadtest.seed_collection --data-root /data && break
            echo "starrocks 아직 준비 안됨, 재시도 ($i/60)"
            sleep 10
          done
          echo "[entrypoint] 준비 완료"
          sleep infinity
      ports:
        - containerPort: 8089  # locust 웹 UI — kubectl port-forward로 접속
      env:
        - name: VECTOR_BACKEND
          value: "starrocks"
        - name: STARROCKS_HOST  # loadtest/k8s/starrocks.yaml의 서비스 이름 — bench용 "starrocks"와 충돌 방지
          value: "starrocks-loadtest"
        - name: MILVUS_COLLECTION
          value: "loadtest_documents"
        - name: LOADTEST_CACHE_DIR  # PVC(loadtest-results)에 저장 — pod를 새로 띄워도 캐시 유지
          value: "/results/cache"
        - name: EMBEDDING_MODEL
          value: "bge-m3"
        - name: EMBEDDING_BATCH_SIZE
          value: "512"
        - name: EMBEDDING_TIMEOUT
          value: "300"
        - name: EMBEDDING_API_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: milvus-migration-secret
              key: EMBEDDING_API_ENDPOINT
        - name: EMBEDDING_API_KEY
          valueFrom:
            secretKeyRef:
              name: milvus-migration-secret
              key: EMBEDDING_API_KEY
        - name: MILVUS_TOKEN
          valueFrom:
            secretKeyRef:
              name: milvus-migration-secret
              key: MILVUS_TOKEN
      volumeMounts:
        - name: loadtest-results
          mountPath: /results
      resources:
        requests:
          cpu: "1"
          memory: "2Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
  volumes:
    - name: loadtest-results
      persistentVolumeClaim:
        claimName: loadtest-results  # loadtest/k8s/pvc.yaml

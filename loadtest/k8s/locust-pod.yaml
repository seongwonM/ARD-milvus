# 부하테스트 디버그/보조 Pod. 뜨자마자 컨테이너가 스스로 준비 단계(쿼리/corpus
# 벡터 캐싱 + milvus 색인)를 끝내놓고 sleep infinity로 넘어간다 — 캐싱/색인
# 스크립트는 이미 되어있으면 스킵하는 로직이 있어서, 파드를 새로 띄워도(재배포
# 해도) 보통 몇 초 안에 끝난다. milvus/minio가 아직 안 떠있으면 최대 10분(60회 x
# 10s) 재시도하며 기다린다 — 이 파드보다 milvus/minio 배포가 늦게 끝나도 안전.
# 용도: 준비 → 테스트 A → 테스트 B → 리포트를 손으로 하나씩 실행해보고 싶을 때,
# 또는 locust 웹 UI(브라우저)로 직접 파라미터를 조작하며 확인하고 싶을 때
# (완전 자동 파이프라인은 loadtest/k8s/locust-job.yaml — 평소엔 그쪽 사용).
# PVC 결과만 빼올 때는 이 pod 말고 loadtest/k8s/debug-pod.yaml + fetch-results.sh를 쓸 것
# (이 pod는 뜨자마자 캐싱/색인을 실제로 실행해버려서 단순 fetch 용도로는 부적절함).
#
# (이미지는 loadtest/** push 시 .github/workflows/build-push-loadtest.yml이 자동으로 빌드/푸시하고
#  아래 image 태그도 자동 갱신한다 — loadtest/Dockerfile 참고)
#
# 사전 준비: milvus/minio를 먼저(또는 이 파드와 거의 동시에) 배포해둘 것
#   kubectl apply -f loadtest/k8s/minio.yaml -n <namespace>
#   kubectl apply -f loadtest/k8s/milvus.yaml -n <namespace>
#
# 실행: kubectl apply -f loadtest/k8s/locust-pod.yaml -n <namespace>
#   (loadtest/k8s/pvc.yaml이 먼저 적용되어 있어야 함 — fetch-results.sh는 이 apply를 대신 해줌)
# 준비 완료 확인: kubectl logs locust-loadtest -n <namespace>  ("[entrypoint] 준비 완료" 나오면 끝)
# 접속: kubectl exec -it locust-loadtest -n <namespace> -- /bin/sh
#
#   # 웹 UI 모드로 직접 클릭하며 확인 (User count/Spawn rate를 브라우저에서 입력)
#   $ locust -f milvus_migration/loadtest/locustfile_baseline.py --web-host 0.0.0.0
#   (다른 터미널에서) kubectl port-forward pod/locust-loadtest 8089:8089 -n <namespace>
#   브라우저로 localhost:8089 접속
#
#   # 또는 headless로 테스트 A: 기준선 (N값을 바꿔가며 여러 번 — 예시 2개)
#   $ locust -f milvus_migration/loadtest/locustfile_baseline.py --headless \
#       -u 1 -r 1 --run-time 3m --interval 10 \
#       --csv=/results/baseline_N10 --logfile=/results/baseline_N10.log
#   $ locust -f milvus_migration/loadtest/locustfile_baseline.py --headless \
#       -u 1 -r 1 --run-time 3m --interval 2 \
#       --csv=/results/baseline_N2 --logfile=/results/baseline_N2.log
#
#   # 테스트 A 결과로 STAGES 값을 확인/조정한 뒤 테스트 B 실행
#   $ locust -f milvus_migration/loadtest/locustfile_ramp.py --headless \
#       --logfile=/results/ramp.log --html=/results/ramp.html \
#       --csv=/results/ramp --request-log=/results/ramp_requests.csv
#
#   # 리포트
#   $ python -m milvus_migration.loadtest.report ramp \
#       --request-log /results/ramp_requests.csv --logfile /results/ramp.log
#
# starrocks로 테스트하려면 색인/locust 실행 전에 export VECTOR_BACKEND=starrocks
# (색인은 밀버스/스타락스 재캐싱 없이 캐시된 벡터를 그대로 재사용)
#
# 결과 확인: ./loadtest/k8s/fetch-results.sh <namespace>  (권장 — 대기+복사 자동화)
#   또는 수동: kubectl cp <namespace>/locust-loadtest:/results ./results
# 삭제: kubectl delete pod locust-loadtest -n <namespace>
apiVersion: v1
kind: Pod
metadata:
  name: locust-loadtest
  labels:
    app: locust-loadtest
spec:
  restartPolicy: Never
  serviceAccountName: loadtest-runner  # 손으로 milvus/minio/starrocks를 apply/delete해볼 때도 쓸 수 있게 동일 권한 부여
  containers:
    - name: locust-loadtest
      image: ghcr.io/seongwonm/ard-milvus-loadtest:ed68ae7af71186deca7c4412a28f7e57e803d4b4
      imagePullPolicy: Always
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -x
          python -m milvus_migration.loadtest.cache_query_vectors --data-root /data
          python -m milvus_migration.loadtest.cache_chunk_vectors --data-root /data
          for i in $(seq 1 60); do
            python -m milvus_migration.loadtest.seed_collection --data-root /data && break
            echo "milvus 아직 준비 안됨, 재시도 ($i/60)"
            sleep 10
          done
          echo "[entrypoint] 준비 완료"
          sleep infinity
      ports:
        - containerPort: 8089  # locust 웹 UI — kubectl port-forward로 접속
      env:
        - name: MILVUS_URI  # loadtest/k8s/milvus.yaml의 서비스 이름 — bench용 "milvus"와 충돌 방지
          value: "http://milvus-loadtest:19530"
        - name: MILVUS_COLLECTION
          value: "loadtest_documents"
        - name: STARROCKS_HOST  # loadtest/k8s/starrocks.yaml의 서비스 이름 — bench용 "starrocks"와 충돌 방지
          value: "starrocks-loadtest"
        - name: LOADTEST_CACHE_DIR  # PVC(loadtest-results)에 저장 — pod를 새로 띄워도 캐시 유지
          value: "/results/cache"
        - name: EMBEDDING_MODEL
          value: "bge-m3"
        - name: EMBEDDING_BATCH_SIZE
          value: "512"
        - name: EMBEDDING_TIMEOUT
          value: "300"
        - name: EMBEDDING_API_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: milvus-migration-secret
              key: EMBEDDING_API_ENDPOINT
        - name: EMBEDDING_API_KEY
          valueFrom:
            secretKeyRef:
              name: milvus-migration-secret
              key: EMBEDDING_API_KEY
        - name: MILVUS_TOKEN
          valueFrom:
            secretKeyRef:
              name: milvus-migration-secret
              key: MILVUS_TOKEN
      volumeMounts:
        - name: loadtest-results
          mountPath: /results
      resources:
        requests:
          cpu: "1"
          memory: "2Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
  volumes:
    - name: loadtest-results
      persistentVolumeClaim:
        claimName: loadtest-results  # loadtest/k8s/pvc.yaml

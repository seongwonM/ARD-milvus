# 부하테스트 디버그/보조 Pod — sleep infinity로 띄워둔다. 두 가지 용도:
#   1) 준비 → 테스트 A → 테스트 B → 리포트를 손으로 하나씩 실행해보고 싶을 때
#      (평소엔 loadtest/k8s/locust-job.yaml이 전부 자동으로 해준다 — 그쪽을 기본으로 쓸 것)
#   2) fetch-results.sh가 Job 완료 후 PVC(loadtest-results)를 읽어오는 통로로 사용
#
# (이미지는 loadtest/** push 시 .github/workflows/build-push-loadtest.yml이 자동으로 빌드/푸시하고
#  아래 image 태그도 자동 갱신한다 — loadtest/Dockerfile 참고)
#
# 실행: kubectl apply -f loadtest/k8s/locust-pod.yaml -n <namespace>
#   (loadtest/k8s/pvc.yaml이 먼저 적용되어 있어야 함 — fetch-results.sh는 이 apply를 대신 해줌)
# 접속: kubectl exec -it locust-loadtest -n <namespace> -- /bin/sh
#
#   # 0) 쿼리/corpus 임베딩 캐싱 (1회성, 백엔드와 무관 — 공유 캐시)
#   $ python -m milvus_migration.loadtest.cache_query_vectors --data-root /data
#   $ python -m milvus_migration.loadtest.cache_chunk_vectors --data-root /data
#
#   # 1) 65,000개 chunk 색인 (캐시된 벡터 삽입 — 기본은 milvus, 아래 env로 전환)
#   $ python -m milvus_migration.loadtest.seed_collection --data-root /data
#   $ VECTOR_BACKEND=starrocks python -m milvus_migration.loadtest.seed_collection --data-root /data
#
#   # 2) 테스트 A: 기준선 (N값을 바꿔가며 여러 번 — 예시 2개)
#   $ locust -f milvus_migration/loadtest/locustfile_baseline.py --headless \
#       -u 1 -r 1 --run-time 3m --interval 10 \
#       --csv=/results/baseline_N10 --logfile=/results/baseline_N10.log
#   $ locust -f milvus_migration/loadtest/locustfile_baseline.py --headless \
#       -u 1 -r 1 --run-time 3m --interval 2 \
#       --csv=/results/baseline_N2 --logfile=/results/baseline_N2.log
#
#   # 3) 테스트 A 결과로 STAGES 값을 확인/조정한 뒤 테스트 B 실행
#   $ locust -f milvus_migration/loadtest/locustfile_ramp.py --headless \
#       --logfile=/results/ramp.log --html=/results/ramp.html \
#       --csv=/results/ramp --request-log=/results/ramp_requests.csv
#
#   # 4) 리포트
#   $ python -m milvus_migration.loadtest.report ramp \
#       --request-log /results/ramp_requests.csv --logfile /results/ramp.log
#
# 결과 확인: ./loadtest/k8s/fetch-results.sh <namespace>  (권장 — 대기+복사 자동화)
#   또는 수동: kubectl cp <namespace>/locust-loadtest:/results ./results
# 삭제: kubectl delete pod locust-loadtest -n <namespace>
apiVersion: v1
kind: Pod
metadata:
  name: locust-loadtest
  labels:
    app: locust-loadtest
spec:
  restartPolicy: Never
  serviceAccountName: loadtest-runner  # 손으로 milvus/minio/starrocks를 apply/delete해볼 때도 쓸 수 있게 동일 권한 부여
  containers:
    - name: locust-loadtest
      image: ghcr.io/seongwonm/ard-milvus-loadtest:849e87fe8d26d06d853b485e725601a020bd7eb8
      imagePullPolicy: Always
      command: ["sleep", "infinity"]
      env:
        - name: MILVUS_URI  # loadtest/k8s/milvus.yaml의 서비스 이름 — bench용 "milvus"와 충돌 방지
          value: "http://milvus-loadtest:19530"
        - name: MILVUS_COLLECTION
          value: "loadtest_documents"
        - name: STARROCKS_HOST  # loadtest/k8s/starrocks.yaml의 서비스 이름 — bench용 "starrocks"와 충돌 방지
          value: "starrocks-loadtest"
        - name: LOADTEST_CACHE_DIR  # PVC(loadtest-results)에 저장 — pod를 새로 띄워도 캐시 유지
          value: "/results/cache"
        - name: EMBEDDING_MODEL
          value: "bge-m3"
        - name: EMBEDDING_BATCH_SIZE
          value: "512"
        - name: EMBEDDING_TIMEOUT
          value: "300"
        - name: EMBEDDING_API_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: milvus-migration-secret
              key: EMBEDDING_API_ENDPOINT
        - name: EMBEDDING_API_KEY
          valueFrom:
            secretKeyRef:
              name: milvus-migration-secret
              key: EMBEDDING_API_KEY
        - name: MILVUS_TOKEN
          valueFrom:
            secretKeyRef:
              name: milvus-migration-secret
              key: MILVUS_TOKEN
      volumeMounts:
        - name: loadtest-results
          mountPath: /results
      resources:
        requests:
          cpu: "1"
          memory: "2Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
  volumes:
    - name: loadtest-results
      persistentVolumeClaim:
        claimName: loadtest-results  # loadtest/k8s/pvc.yaml

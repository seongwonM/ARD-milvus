# 부하테스트 전체 생애주기(milvus/minio 배포 → 색인/캐싱 → 테스트 A/B → 리포트 →
# milvus/minio 정리)를 이 Job이 전부 스스로 관리한다. apply 한 번이면 끝 —
# 실행 전/후로 사람이 milvus/minio를 따로 지우고 다시 띄울 필요가 없다.
# (실제 배포/삭제 로직은 loadtest/entrypoint.sh, 권한은 loadtest/k8s/rbac.yaml)
#
# 사전 준비(최초 1회, 네임스페이스당 한 번만):
#   kubectl apply -f loadtest/k8s/rbac.yaml -n <namespace>
#   kubectl apply -f loadtest/k8s/pvc.yaml -n <namespace>
#   Secret(milvus-migration-secret: EMBEDDING_API_ENDPOINT/EMBEDDING_API_KEY/MILVUS_TOKEN)이
#   이미 있어야 한다 (없으면 k8s/pod.yaml 주석 참고해서 생성).
#
# 실행: kubectl apply -f loadtest/k8s/locust-job.yaml -n <namespace>
# 진행 확인: kubectl logs -f job/milvus-loadtest -n <namespace>
# 결과 가져오기: ./loadtest/k8s/fetch-results.sh <namespace>
# 재실행(값 조정 후): kubectl delete job milvus-loadtest -n <namespace> 후 다시 apply
#   (milvus/minio는 Job이 시작/종료 시 스스로 정리하므로 사람이 신경 쓸 필요 없음)
# 삭제: kubectl delete job milvus-loadtest -n <namespace>
#
# BASELINE_INTERVALS/LOADTEST_STAGE_USERS/LOADTEST_STAGE_DURATION_SEC는 테스트 A
# 결과(L0)로 Little's Law를 역산해서 다시 조정하는 값 — 이미지 재빌드 없이 아래
# env만 고치고 재적용하면 된다.
apiVersion: batch/v1
kind: Job
metadata:
  name: milvus-loadtest
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200  # 무한정 매달리는 것 방지용 안전장치. 기본값 기준 총 소요 ~1~1.5시간
  # 예상. stage 시간/개수를 늘리면 이 값도 같이 늘릴 것.
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: loadtest-runner  # loadtest/k8s/rbac.yaml — 자기 ns의 milvus/minio를 스스로 apply/delete
      containers:
        - name: loadtest
          image: ghcr.io/seongwonm/ard-milvus-loadtest:5cb9f1692337f9497e590783a91b1ccf259d0d5b
          imagePullPolicy: Always
          command: ["/bin/sh", "/app/milvus_migration/loadtest/entrypoint.sh"]
          env:
            - name: MILVUS_NAMESPACE  # entrypoint.sh가 이 값으로 milvus/minio를 apply/delete
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MILVUS_URI
              value: "http://milvus:19530"
            - name: MILVUS_COLLECTION
              value: "loadtest_documents"
            - name: BASELINE_INTERVALS
              value: "10 5 2 1 0.5 0.2"   # 테스트 A에서 순서대로 돌려볼 N(초) 목록 — 공백 구분
            - name: BASELINE_RUNTIME
              value: "3m"                 # 테스트 A 한 번(N값 하나)당 실행 시간
            - name: LOADTEST_STAGE_USERS
              value: "1,2,5,10,20,50,100,200,500"  # 테스트 B 동시 사용자 단계 — 콤마 구분
            - name: LOADTEST_STAGE_DURATION_SEC
              value: "240"                # 테스트 B 각 stage 유지 시간(초)
            - name: EMBEDDING_MODEL
              value: "bge-m3"
            - name: EMBEDDING_BATCH_SIZE
              value: "512"
            - name: EMBEDDING_TIMEOUT
              value: "300"
            - name: EMBEDDING_API_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: milvus-migration-secret
                  key: EMBEDDING_API_ENDPOINT
            - name: EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: milvus-migration-secret
                  key: EMBEDDING_API_KEY
            - name: MILVUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: milvus-migration-secret
                  key: MILVUS_TOKEN
          volumeMounts:
            - name: loadtest-results
              mountPath: /results
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: loadtest-results
          persistentVolumeClaim:
            claimName: loadtest-results  # loadtest/k8s/pvc.yaml

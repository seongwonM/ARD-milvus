# loadtest 전용 StarRocks manifest — milvus-loadtest/minio-loadtest와 나란히 놓고
# 동일한 baseline/ramp 테스트를 돌려 속도를 비교하기 위한 것.
#
# starrocks/allin1-ubuntu: FE+BE가 한 컨테이너에 다 들어있는 이미지 — Milvus의
# 단일 Pod 구성과 그림을 맞추기 위해 이걸 골랐다 (실제 운영 클러스터는 보통 FE/BE를
# 분리하지만, 이건 순수 비교용 최소 구성).
#
# 리소스는 원래 loadtest/k8s/milvus.yaml과 동일하게(공정 비교 목적) 맞췄었으나, 그
# 사양(4Gi/8Gi)으로는 insert 도중 BE가 OOMKilled됐다(2026-07 실측, k8s/starrocks.yaml에서
# 먼저 확인됨). StarRocks 공식 최소 권장 사양은 8vCPU/32GB이고, allin1(FE+BE 한 컨테이너)
# 구성은 컨테이너 cgroup 메모리 감지가 부정확한 것으로 알려진 이슈도 있어(StarRocks#67607)
# 작은 컨테이너에서 특히 취약하다. 8Gi/16Gi로 올렸다 — Milvus와의 리소스 대칭은 깨지지만,
# 애초에 "같은 리소스로 공정 비교" 자체가 StarRocks엔 안 맞았던 전제였다는 뜻이기도 하다.
#
# 그래도 8Gi/16Gi에서 insert 배치를 조금만 키워도(bench 예산 20MB 시도, 2026-07 실측) 바로
# 재발했다 — 위 StarRocks#67607(jemalloc이 해제한 메모리를 OS에 안 돌려줘 RSS가 누적되고,
# BE 자체 메모리 트래커도 컨테이너 환경에서 실제 사용량을 잘못 계산함)가 원인으로 보인다.
# dirty_decay_ms/muzzy_decay_ms 기본값(5000ms)이 "too slow"라 MALLOC_CONF로 0을 줘서
# jemalloc이 안 쓰는 메모리를 즉시 OS에 반환하게 한다(대신 매 할당마다 syscall이 늘어
# 약간의 성능 손해는 있음 — jemalloc#2483에서 dirty_decay_ms:0이 메모리 사용량을
# 안정적으로 유지한다고 실측 확인됨).
#
# 벡터 인덱스(HNSW)는 StarRocks 3.4+에서만 지원 — 3.5.19(안정 버전) 사용.
# FE의 enable_experimental_vector 설정은 starrocks_store.py가 접속 시 자동으로 켠다.
#
# PVC를 /data/deploy/starrocks에 마운트하지 않는다 — 이 이미지는 FE/BE 전체(entrypoint.sh,
# common.sh, conf.template, fe.conf 등)가 이미지 안에 그 경로로 미리 빌드되어 들어있는데,
# 빈 PVC를 그 경로에 얹으면 그 내장 파일들이 통째로 가려져서 entrypoint.sh가 common.sh/
# conf.template/fe.conf를 못 찾는 에러로 이어진다(k8s/starrocks.yaml에서 실제로 발생,
# 2026-07-06). 공식 실행 예시(docker run, StarRocks/starrocks 저장소의
# docker/dockerfiles/allin1/allin1-HOWTO.md)도 볼륨 마운트 없이 그냥 띄우는 방식이라
# 그대로 따름 — 순수 비교용 벤치마크 도구라 pod 재시작 시 데이터가 날아가도 되고
# (재색인하면 됨), 데이터 영속성이 필요하면 fe/meta, be/storage 같은 하위 경로에만
# 별도로 마운트해야 한다(이 root 경로 전체를 덮어쓰면 안 됨).
apiVersion: v1
kind: Pod
metadata:
  name: starrocks-loadtest
  labels:
    app: starrocks-loadtest
spec:
  containers:
    - name: starrocks
      image: starrocks/allin1-ubuntu:3.5.19
      env:
        - name: MALLOC_CONF  # jemalloc이 안 쓰는 메모리를 즉시 OS에 반환하도록(StarRocks#67607)
          value: "dirty_decay_ms:0,muzzy_decay_ms:0"
      ports:
        - containerPort: 9030  # MySQL 프로토콜(FE 쿼리 포트) — starrocks_store.py가 여기로 접속
        - containerPort: 8030  # FE http
      resources:
        requests:
          cpu: "1"
          memory: "8Gi"
        limits:
          cpu: "4"
          memory: "16Gi"
      readinessProbe:
        # allin1 이미지는 FE 메타데이터 초기화 + BE 등록까지 컨테이너 시작 후 수십 초
        # 걸릴 수 있어서, 쿼리 포트(9030)가 실제로 리스닝하는지로 Ready 여부를 판단한다.
        tcpSocket:
          port: 9030
        initialDelaySeconds: 30
        periodSeconds: 10
        failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: starrocks-loadtest
spec:
  selector:
    app: starrocks-loadtest
  ports:
    - name: query
      port: 9030
      targetPort: 9030
    - name: http
      port: 8030
      targetPort: 8030

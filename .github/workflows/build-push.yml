name: Build and Push milvus-migration

on:
  push:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "*.py"
      - "bench/**"
      - "data/**"
      - ".github/workflows/build-push.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/seongwonm/ard-milvus

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Update image tags
        run: |
          sed -i "s|${{ env.IMAGE }}:.*|${{ env.IMAGE }}:${{ github.sha }}|" k8s/pod.yaml
          sed -i "s|${{ env.IMAGE }}:.*|${{ env.IMAGE }}:${{ github.sha }}|g" k8s/bench-jobs.yaml
          sed -i "s|${{ env.IMAGE }}:.*|${{ env.IMAGE }}:${{ github.sha }}|g" k8s/bench-jobs-starrocks.yaml
          sed -i "s|${{ env.IMAGE }}:.*|${{ env.IMAGE }}:${{ github.sha }}|g" k8s/rerank-job-bge.yaml
          for f in k8s/rerank-job-qwen3-top*.yaml; do
            sed -i "s|${{ env.IMAGE }}:.*|${{ env.IMAGE }}:${{ github.sha }}|g" "$f"
          done
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s/pod.yaml k8s/bench-jobs.yaml k8s/bench-jobs-starrocks.yaml k8s/rerank-job-bge.yaml k8s/rerank-job-qwen3-top*.yaml
          git commit -m "ci: update image tag to ${{ github.sha }}"
          git push

name: Build and Push milvus-migration

on:
  push:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "*.py"
      - "core/**"
      - "bench/**"
      - "data/**"
      - ".github/workflows/build-push.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/seongwonm/ard-milvus

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Update image tags
        run: |
          sed -i "s|${{ env.IMAGE }}:.*|${{ env.IMAGE }}:${{ github.sha }}|" k8s/pod.yaml
          sed -i "s|${{ env.IMAGE }}:.*|${{ env.IMAGE }}:${{ github.sha }}|g" k8s/jobs/bench-jobs.yaml
          sed -i "s|${{ env.IMAGE }}:.*|${{ env.IMAGE }}:${{ github.sha }}|g" k8s/jobs/bench-jobs-starrocks.yaml
          sed -i "s|${{ env.IMAGE }}:.*|${{ env.IMAGE }}:${{ github.sha }}|g" k8s/jobs/rerank-job-bge.yaml
          for f in k8s/jobs/rerank-job-qwen3-top*.yaml; do
            sed -i "s|${{ env.IMAGE }}:.*|${{ env.IMAGE }}:${{ github.sha }}|g" "$f"
          done
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s/pod.yaml k8s/jobs/bench-jobs.yaml k8s/jobs/bench-jobs-starrocks.yaml k8s/jobs/rerank-job-bge.yaml k8s/jobs/rerank-job-qwen3-top*.yaml
          git commit -m "ci: update image tag to ${{ github.sha }}"
          # main이 이 워크플로 실행 중에 앞으로 나가있으면(build-push-loadtest.yml과 동시
          # 트리거되는 push 등) 그냥 push가 non-fast-forward로 실패한다 — rebase 후
          # 재시도해서 흡수한다(2026-07-08 실제 발생).
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            echo "push 실패, 재시도 ($i/5)"
            sleep $((i * 3))
          done

apiVersion: v1
kind: Pod
metadata:
  name: ard-milvus
  labels:
    app: ard-milvus
spec:
  restartPolicy: Never
  containers:
    - name: ard-milvus
      image: ghcr.io/seongwonm/ard-milvus:fda413c0dfdf2de18d75a4d462529c8e858a3b19
      imagePullPolicy: Always
      command: ["/bin/sh", "-c"]
      args:
        - |
          git clone https://$(GITHUB_TOKEN)@github.com/seongwonM/SH-ARD-embedding-develop.git /tmp/data &&
          python -m milvus_migration.bench.runner \
            --data-root /tmp/data/data \
            --out /results \
            --search-concurrency 1 4 8 16
      env:
        - name: MILVUS_URI
          value: "http://milvus:19530"
        - name: MILVUS_COLLECTION
          value: "documents"
        - name: EMBEDDING_API_ENDPOINT
          value: "https://api.company.internal/v1/embeddings"
        - name: EMBEDDING_MODEL
          value: "bge-m3"
        - name: EMBEDDING_DIM
          value: "1024"
        - name: EMBEDDING_BATCH_SIZE
          value: "64"
        - name: EMBEDDING_TIMEOUT
          value: "60"
        - name: MILVUS_TOKEN
          valueFrom:
            secretKeyRef:
              name: milvus-migration-secret
              key: MILVUS_TOKEN
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: milvus-migration-secret
              key: GITHUB_TOKEN
        - name: EMBEDDING_API_KEY
          valueFrom:
            secretKeyRef:
              name: milvus-migration-secret
              key: EMBEDDING_API_KEY
      resources:
        requests:
          cpu: "250m"
          memory: "256Mi"
        limits:
          cpu: "1"
          memory: "512Mi"

# Reranking Job — retrieval Job 3개(k8s/bench-jobs.yaml)가 모두 완료된 뒤 적용하세요.
# 3개 retrieval 결과 × top_n(5/10/20/50/100) × 리랭커(bge/qwen3) 조합마다 Job(pod)을
# 따로 분리했습니다 — top_n을 한 pod에서 순차로 돌리면 뒤 top_n일수록 느려지는지
# (캐시/스로틀링 등) top_n 자체의 속도 차이인지 구분이 안 돼서, top_n별로도 격리해
# 속도를 정확히 재기 위함입니다:
#   - bge-reranker-v2-m3: 전용 rerank API (--rerank-model)
#   - Qwen3-Embedding-8B: retrieval 때 쓰던 임베딩 API 재사용, cosine 재정렬
#     (--embedding-rerank-model — "qwen3 reranker"는 별도 API가 아니라 이 방식)
#
# 실행:
#   kubectl wait --for=condition=complete \
#     job/bench-retrieval-hcp job/bench-retrieval-m3 job/bench-retrieval-qwen3 --timeout=3600s
#   kubectl apply -f k8s/rerank-job.yaml
#
# 삭제: kubectl delete job bench-rerank-bge-top5 bench-rerank-bge-top10 bench-rerank-bge-top20 \
#   bench-rerank-bge-top50 bench-rerank-bge-top100 bench-rerank-qwen3-top5 bench-rerank-qwen3-top10 \
#   bench-rerank-qwen3-top20 bench-rerank-qwen3-top50 bench-rerank-qwen3-top100
# 로그: kubectl logs job/bench-rerank-bge-top5  (top_n별로 각각 확인)
# 결과를 로컬로 자동 복사: ./k8s/fetch-results.ps1 -Stage rerank  (Job 완료까지 대기 후 results/에 저장)
#
# 리소스: rerank는 Milvus 접속 없이 corpus_all.parquet(약 21MB)만 메모리에 올려두고
# API만 호출하는 가벼운 워크로드라 pod당 request 512Mi/limit 1.5Gi로 충분함.
# 10개 Job(pod) 동시 적용 기준 합계 = request 5Gi / limit 15Gi, cpu request 2 / limit 10 —
# 가용 자원(CPU 20 / RAM 33Gi) 안에 여유 있게 들어와서 굳이 순차로 나눠 띄울 필요 없음.
#
# STARTUP_DELAY_SEC: 10개 pod가 전부 동시에 같은 API(엔드포인트 공유)를 두들기면 지연이
# 심해져서, Job마다 15초씩 엇갈리게(0/15/30/.../135초) 시작 전 대기하도록 함
# (rerank_runner.py가 이 대기를 "총 소요시간" 집계 전에 처리 — elapsed/qps에는 안 들어감).
#
# REQUEST_INTERVAL_SEC: 시작만 엇갈려도 각 pod 내부에서 쿼리를 연달아 쏘면 결국 API에
# 몰리므로, 쿼리 호출 사이마다 0.5s씩 추가로 대기. 이 시간도 elapsed/qps 집계에서 제외됨
# (bench/rerank_runner.py의 run_rerank가 재시도 실패 시간과 함께 별도로 빼고 기록).
#
# 재시도: reranker.py/embedding.py 둘 다 실패 시 무한 재시도(백오프 상한 30s) — 쿼리를
# 버릴 수 없어서 3회 만에 포기하지 않고 성공할 때까지 계속 시도함.

# ── 1. Reranker: bge-reranker-v2-m3 (전용 rerank API) ────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: bench-rerank-bge-top5
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: bench
          image: ghcr.io/seongwonm/ard-milvus:df7e630fa0a19acfca30d0fb541c5e67a007cd40
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              python -m milvus_migration.bench.rerank_runner \
                --retrieval-result \
                  /results/retrieval/hcp_llm_latest_top100.json \
                  /results/retrieval/bge_m3_top100.json \
                  /results/retrieval/qwen3_embedding_8b_top100.json \
                --rerank-model bge-reranker-v2-m3 \
                --top-n 5 \
                --data-root /data \
                --out /results/rerank
          env:
            - name: STARTUP_DELAY_SEC  # 동시에 뜨는 rerank Job들끼리 API 요청 엇박 처리
              value: "0"
            - name: REQUEST_INTERVAL_SEC  # 쿼리마다 API 호출 사이 대기 (소요시간 집계에서는 제외)
              value: "0.5"
            - name: EMBEDDING_BATCH_SIZE
              value: "512"
            - name: EMBEDDING_TIMEOUT
              value: "120"
            - name: EMBEDDING_API_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: milvus-migration-secret
                  key: EMBEDDING_API_ENDPOINT
            - name: EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: milvus-migration-secret
                  key: EMBEDDING_API_KEY
          volumeMounts:
            - name: bench-results
              mountPath: /results
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1.5Gi"
      volumes:
        - name: bench-results
          persistentVolumeClaim:
            claimName: bench-results

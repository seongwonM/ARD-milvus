# Reranking Job — retrieval Job 3개(k8s/bench-jobs.yaml)가 모두 완료된 뒤 적용하세요.
# 3개 retrieval 결과 × top_n 5/10/20/50/100 조합을 리랭커별로 순차 실행합니다.
# 리랭커 2개는 방식이 다르고, 같은 환경에서 속도를 재기 위해 Job(pod)도 따로 분리했습니다:
#   - bge-reranker-v2-m3: 전용 rerank API (--rerank-model)
#   - Qwen3-Embedding-8B: retrieval 때 쓰던 임베딩 API 재사용, cosine 재정렬
#     (--embedding-rerank-model — "qwen3 reranker"는 별도 API가 아니라 이 방식)
#
# 실행:
#   kubectl wait --for=condition=complete \
#     job/bench-retrieval-hcp job/bench-retrieval-m3 job/bench-retrieval-qwen3 --timeout=3600s
#   kubectl apply -f k8s/rerank-job.yaml
#
# 삭제: kubectl delete job bench-rerank-bge bench-rerank-qwen3
# 로그: kubectl logs job/bench-rerank-bge  /  kubectl logs job/bench-rerank-qwen3
# 결과를 로컬로 자동 복사: ./k8s/fetch-results.ps1 -Stage rerank  (Job 완료까지 대기 후 results/에 저장)

# ── 1. Reranker: bge-reranker-v2-m3 (전용 rerank API) ────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: bench-rerank-bge
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: bench
          image: ghcr.io/seongwonm/ard-milvus:2320623e71762a1c8bf6acfa6f75e5a219d5d61b
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              python -m milvus_migration.bench.rerank_runner \
                --retrieval-result \
                  /results/retrieval/hcp_llm_latest_top100.json \
                  /results/retrieval/bge_m3_top100.json \
                  /results/retrieval/qwen3_embedding_8b_top100.json \
                --rerank-model bge-reranker-v2-m3 \
                --top-n 5 10 20 50 100 \
                --data-root /data \
                --out /results/rerank
          env:
            - name: EMBEDDING_BATCH_SIZE
              value: "512"
            - name: EMBEDDING_TIMEOUT
              value: "120"
            - name: EMBEDDING_API_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: milvus-migration-secret
                  key: EMBEDDING_API_ENDPOINT
            - name: EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: milvus-migration-secret
                  key: EMBEDDING_API_KEY
          volumeMounts:
            - name: bench-results
              mountPath: /results
          resources:
            requests:
              cpu: "250m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: bench-results
          persistentVolumeClaim:
            claimName: bench-results
---
# ── 2. Reranker: Qwen3-Embedding-8B (임베딩 API 재사용, cosine 재정렬) ─────────
apiVersion: batch/v1
kind: Job
metadata:
  name: bench-rerank-qwen3
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: bench
          image: ghcr.io/seongwonm/ard-milvus:2320623e71762a1c8bf6acfa6f75e5a219d5d61b
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              python -m milvus_migration.bench.rerank_runner \
                --retrieval-result \
                  /results/retrieval/hcp_llm_latest_top100.json \
                  /results/retrieval/bge_m3_top100.json \
                  /results/retrieval/qwen3_embedding_8b_top100.json \
                --embedding-rerank-model Qwen3-Embedding-8B \
                --top-n 5 10 20 50 100 \
                --data-root /data \
                --out /results/rerank
          env:
            - name: EMBEDDING_BATCH_SIZE
              value: "512"
            - name: EMBEDDING_TIMEOUT
              value: "120"
            - name: EMBEDDING_API_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: milvus-migration-secret
                  key: EMBEDDING_API_ENDPOINT
            - name: EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: milvus-migration-secret
                  key: EMBEDDING_API_KEY
          volumeMounts:
            - name: bench-results
              mountPath: /results
          resources:
            requests:
              cpu: "250m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: bench-results
          persistentVolumeClaim:
            claimName: bench-results

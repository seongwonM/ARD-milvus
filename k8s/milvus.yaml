apiVersion: v1
kind: ConfigMap
metadata:
  name: milvus-config
data:
  embedEtcd.yaml: |
    listen-client-urls: http://0.0.0.0:2379
    advertise-client-urls: http://0.0.0.0:2379
    quota-backend-bytes: 4294967296
    auto-compaction-mode: revision
    auto-compaction-retention: "1000"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: milvus-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: milvus
  labels:
    app: milvus
spec:
  containers:
    - name: milvus
      image: milvusdb/milvus:v2.4.24
      command: ["milvus", "run", "standalone"]
      env:
        - name: ETCD_USE_EMBED
          value: "true"
        - name: ETCD_DATA_DIR
          value: "/var/lib/milvus/etcd"
        - name: ETCD_CONFIG_PATH
          value: "/milvus/configs/embedEtcd.yaml"
        - name: MINIO_ADDRESS
          value: "minio:9000"
        - name: MINIO_ACCESS_KEY_ID
          value: minioadmin
        - name: MINIO_SECRET_ACCESS_KEY
          value: minioadmin
      ports:
        - containerPort: 19530
      volumeMounts:
        - name: milvus-config
          mountPath: /milvus/configs/embedEtcd.yaml
          subPath: embedEtcd.yaml
        - name: milvus-data
          mountPath: /var/lib/milvus
      resources:
        requests:
          cpu: "1"
          memory: "4Gi"
        limits:
          cpu: "4"
          memory: "8Gi"
  volumes:
    - name: milvus-config
      configMap:
        name: milvus-config
    - name: milvus-data
      persistentVolumeClaim:
        claimName: milvus-data
---
apiVersion: v1
kind: Service
metadata:
  name: milvus
spec:
  selector:
    app: milvus
  ports:
    - port: 19530
      targetPort: 19530

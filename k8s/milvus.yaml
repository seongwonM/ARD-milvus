apiVersion: v1
kind: ConfigMap
metadata:
  name: milvus-config
data:
  embedEtcd.yaml: |
    listen-client-urls: http://0.0.0.0:2379
    advertise-client-urls: http://0.0.0.0:2379
    quota-backend-bytes: 4294967296
    auto-compaction-mode: revision
    auto-compaction-retention: "1000"
---
apiVersion: v1
kind: Pod
metadata:
  name: milvus
  labels:
    app: milvus
spec:
  containers:
    - name: milvus
      image: milvusdb/milvus:v2.4.24
      command: ["milvus", "run", "standalone"]
      env:
        - name: ETCD_USE_EMBED
          value: "true"
        - name: ETCD_DATA_DIR
          value: "/var/lib/milvus/etcd"
        - name: ETCD_CONFIG_PATH
          value: "/milvus/configs/embedEtcd.yaml"
        - name: COMMON_STORAGETYPE
          value: "local"
      ports:
        - containerPort: 19530
      volumeMounts:
        - name: milvus-config
          mountPath: /milvus/configs/embedEtcd.yaml
          subPath: embedEtcd.yaml
      resources:
        requests:
          cpu: "250m"
          memory: "512Mi"
        limits:
          cpu: "1"
          memory: "2Gi"
  volumes:
    - name: milvus-config
      configMap:
        name: milvus-config
---
apiVersion: v1
kind: Service
metadata:
  name: milvus
spec:
  selector:
    app: milvus
  ports:
    - port: 19530
      targetPort: 19530

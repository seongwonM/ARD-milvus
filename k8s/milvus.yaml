apiVersion: v1
kind: Pod
metadata:
  name: etcd
  labels:
    app: etcd
spec:
  containers:
    - name: etcd
      image: bitnami/etcd:3.5
      env:
        - name: ALLOW_NONE_AUTHENTICATION
          value: "yes"
        - name: ETCD_ADVERTISE_CLIENT_URLS
          value: http://etcd:2379
        - name: ETCD_LISTEN_CLIENT_URLS
          value: http://0.0.0.0:2379
      ports:
        - containerPort: 2379
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: etcd
spec:
  selector:
    app: etcd
  ports:
    - port: 2379
      targetPort: 2379
---
apiVersion: v1
kind: Pod
metadata:
  name: minio
  labels:
    app: minio
spec:
  containers:
    - name: minio
      image: minio/minio:latest
      command: ["minio", "server", "/data", "--console-address", ":9001"]
      env:
        - name: MINIO_ACCESS_KEY
          value: minioadmin
        - name: MINIO_SECRET_KEY
          value: minioadmin
      ports:
        - containerPort: 9000
        - containerPort: 9001
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector:
    app: minio
  ports:
    - port: 9000
      targetPort: 9000
---
apiVersion: v1
kind: Pod
metadata:
  name: milvus
  labels:
    app: milvus
spec:
  containers:
    - name: milvus
      image: milvusdb/milvus:v2.4.13
      command: ["milvus", "run", "standalone"]
      env:
        - name: ETCD_ENDPOINTS
          value: etcd:2379
        - name: MINIO_ADDRESS
          value: minio:9000
      ports:
        - containerPort: 19530
      resources:
        requests:
          cpu: "250m"
          memory: "512Mi"
        limits:
          cpu: "1"
          memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: milvus
spec:
  selector:
    app: milvus
  ports:
    - port: 19530
      targetPort: 19530

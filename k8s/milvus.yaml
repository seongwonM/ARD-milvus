apiVersion: v1
kind: Pod
metadata:
  name: milvus
  labels:
    app: milvus
spec:
  containers:
    - name: milvus
      image: milvusdb/milvus:v2.4.24
      command: ["milvus", "run", "standalone"]
      env:
        - name: ETCD_ENDPOINTS
          value: etcd:2379
        - name: MINIO_ADDRESS
          value: minio:9000
        - name: MINIO_ACCESS_KEY_ID
          value: minioadmin
        - name: MINIO_SECRET_ACCESS_KEY
          value: minioadmin
      ports:
        - containerPort: 19530
      resources:
        requests:
          cpu: "250m"
          memory: "512Mi"
        limits:
          cpu: "1"
          memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: milvus
spec:
  selector:
    app: milvus
  ports:
    - port: 19530
      targetPort: 19530

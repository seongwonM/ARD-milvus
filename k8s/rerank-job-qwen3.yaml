# Reranking Job — Qwen3-Embedding-8B (retrieval 때 쓰던 임베딩 API 재사용, cosine 재정렬,
# --embedding-rerank-model — "qwen3 reranker"는 별도 API가 아니라 이 방식).
# qwen3_embedding_8b_top100.json(=qwen3 자기 자신의 retrieval 결과)은 --retrieval-result에서
# 뺐음 — bi-encoder라 retrieval과 rerank가 같은 모델/벡터면 재정렬해도 순위가 거의 그대로라
# 정보량이 없는 조합(2026-07-06). hcp_llm/bge_m3 retrieval 결과를 qwen3로 다시 임베딩하는
# 건 다른 계열 bi-encoder 앙상블이라 의미 있어서 그대로 둠.
# PVC(bench-results)에 /results/retrieval/*.json (retrieval top100 결과)이 이미 있어야
# 합니다 — retrieval Job 3개(k8s/bench-jobs.yaml)를 돌려서 채우거나, 로컬에 이미 있는
# top100 결과를 아래 "PVC 준비" 방법으로 직접 주입하세요.
#
# top_n(5/10/20/50/100)을 Job/pod 5개로 나눠 동시에 띄웠었는데(2026-07-06 이전), pod
# 5개가 STARTUP_DELAY_SEC(0/15/30/45/60s)로 살짝만 엇갈려 시작해서 사실상 같은 API를
# 동시에 두드리는 구조였고, 그로 인해 먼저 시작한 pod가 서버를 붙잡는 동안 뒤 pod가
# 밀리는 현상 + 코퍼스/retrieval JSON을 pod마다 중복으로 메모리에 올려서 OOM까지 겹쳤다
# (2026-07-06). 그래서 pod 하나로 합치고 rerank_runner.py의 --top-n에 5개 값을 한 번에
# 넘겨 순차 처리하도록 되돌렸다 — --top-n은 원래 nargs="+"라 여러 값을 받으면 값마다
# 순서대로 run_rerank()를 호출하고, 그때마다 결과를 바로 PVC에 저장한 뒤 다음 top_n으로
# 넘어간다(코드 변경 없음). 코퍼스/retrieval JSON은 프로세스 시작 시 한 번만 메모리에
# 올라가고, top_n별 문서 벡터 캐시(doc_vec_map)도 한 top_n이 끝나면 다음 top_n으로 넘어가기
# 전에 GC 대상이 되므로, 5개 pod에 흩어 올렸던 것보다 오히려 메모리 사용이 안정적이다.
#
# 실행: (k8s/rerank-job-bge.yaml을 먼저 적용해 완료를 확인한 뒤 이 파일을 적용하는 걸 권장)
#   kubectl wait --for=condition=complete job/bench-rerank-bge-top5 job/bench-rerank-bge-top10 \
#     job/bench-rerank-bge-top20 job/bench-rerank-bge-top50 job/bench-rerank-bge-top100 --timeout=3600s
#   kubectl apply -f k8s/rerank-job-qwen3.yaml
#
# PVC 준비 (retrieval Job 없이 로컬 top100 결과를 직접 쓰는 경우 — k8s/pod.yaml 참고).
# 로컬도 results/retrieval/ 폴더 구조 그대로 유지해야 함(경로 자체가 --retrieval-result와 일치해야 함):
#   kubectl apply -f k8s/bench-results-pvc.yaml
#   kubectl apply -f k8s/pod.yaml
#   kubectl cp ./results/retrieval/hcp_llm_latest_top100.json ard-milvus:/results/retrieval/hcp_llm_latest_top100.json
#   kubectl cp ./results/retrieval/bge_m3_top100.json ard-milvus:/results/retrieval/bge_m3_top100.json
#   kubectl apply -f k8s/rerank-job-qwen3.yaml
#
# 삭제: kubectl delete job bench-rerank-qwen3
# 로그: kubectl logs job/bench-rerank-qwen3 -f  (top_n 5개가 한 pod에서 순서대로 찍힘)
# 결과를 로컬로 자동 복사: ./k8s/fetch-results.ps1 -Stage rerank  (Job 완료까지 대기 후 results/에 저장)
#
# EMBEDDING_BATCH_SIZE=256: 문서 사전 인코딩(순차 호출, bench/rerank_runner.py의
# make_precomputed_embedding_score_fn) 한 번의 API 요청에 담는 문서 수.
#
# RERANK_CONCURRENCY=16: 쿼리 처리(요청마다 텍스트 1개짜리 임베딩 호출)용 큐 크기.
# 이전엔 쿼리 요청이 가볍다는 이유로 256까지 올렸었지만, pod를 하나로 합친 김에 bge와
# 같은 보수적인 값(16)으로 맞춰서 서버 부하를 더 안전하게 가져간다(2026-07-06). QPS는
# 총 소요시간이 아니라 API 응답 latency로부터 역산하므로(Little's Law) 이 값을 낮춰도
# QPS 계산 자체가 왜곡되지는 않는다.
#
# 재시도/백오프: 개별 호출 attempt 기반 대신 풀 공유 쿨다운(서킷 브레이커, reranker.py/
# embedding.py의 _wait_if_paused 참고)으로 AWS "Full Jitter" 방식을 적용해 워커들이
# 똑같은 시각에 우르르 재시도하는 걸 방지함. 무한 재시도(백오프 상한 30s) — 쿼리를
# 버릴 수 없어서 3회 만에 포기하지 않고 성공할 때까지 계속 시도한다.

apiVersion: batch/v1
kind: Job
metadata:
  name: bench-rerank-qwen3
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: bench
          image: ghcr.io/seongwonm/ard-milvus:a4780e15b6275a64c41cf30774b02c37d5f302f3
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              python -m milvus_migration.bench.rerank_runner \
                --retrieval-result \
                  /results/retrieval/hcp_llm_latest_top100.json \
                  /results/retrieval/bge_m3_top100.json \
                --embedding-rerank-model Qwen3-Embedding-8B \
                --top-n 5 10 20 50 100 \
                --data-root /data \
                --out /results/rerank
          env:
            - name: REQUEST_INTERVAL_SEC  # 쿼리마다 API 호출 사이 대기 (소요시간 집계에서는 제외)
              value: "0"
            - name: RERANK_CONCURRENCY  # 큐로 동시에 흘려보낼 요청 수 (워커 풀 크기) — QPS는 latency 기반으로 계산
              value: "16"
            - name: EMBEDDING_BATCH_SIZE
              value: "256"
            - name: EMBEDDING_TIMEOUT
              value: "300"
            - name: EMBEDDING_API_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: milvus-migration-secret
                  key: EMBEDDING_API_ENDPOINT
            - name: EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: milvus-migration-secret
                  key: EMBEDDING_API_KEY
          volumeMounts:
            - name: bench-results
              mountPath: /results
          resources:
            requests:
              cpu: "500m"
              memory: "1.5Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: bench-results
          persistentVolumeClaim:
            claimName: bench-results

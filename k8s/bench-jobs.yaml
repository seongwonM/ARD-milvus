# 6가지 콤보 벤치마크 Job
# Secret: milvus-migration-secret (EMBEDDING_API_ENDPOINT, EMBEDDING_API_KEY, MILVUS_TOKEN, GITHUB_TOKEN)
#
# 실행: kubectl apply -f k8s/bench-jobs.yaml
# 로그: kubectl logs job/bench-dense

# ── 1. dense ──────────────────────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: bench-dense
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: bench
          image: ghcr.io/seongwonm/ard-milvus:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - >-
              python -m milvus_migration.bench.runner
              --vector-mode dense
              --data-root /data
              --out /tmp/results
              --search-concurrency 1 4 8 16 &&
              git clone https://$(GITHUB_TOKEN)@github.com/seongwonM/ARD-milvus.git /tmp/repo &&
              cp /tmp/results/*.json /tmp/repo/results/ &&
              cd /tmp/repo &&
              git config user.email "bench-bot@pod" &&
              git config user.name "bench-bot" &&
              git add results/ &&
              git commit -m "bench: dense $(date +%Y%m%d_%H%M%S)" &&
              git push
          env:
            - name: MILVUS_URI
              value: "http://milvus:19530"
            - name: EMBEDDING_MODEL
              value: "bge-m3"
            - name: EMBEDDING_DIM
              value: "1024"
            - name: EMBEDDING_BATCH_SIZE
              value: "2048"
            - name: EMBEDDING_TIMEOUT
              value: "300"
          envFrom:
            - secretRef:
                name: milvus-migration-secret
          resources:
            requests:
              cpu: "250m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
---

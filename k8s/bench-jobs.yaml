# Retrieval 3모델(HCP-LLM-Latest / bge-m3 / Qwen3-Embedding-8B) 벤치마크 Job
# Reranking은 k8s/rerank-job.yaml — 이 Job들이 모두 끝난 뒤 별도 적용하세요.
# Secret: milvus-migration-secret (EMBEDDING_API_ENDPOINT, EMBEDDING_API_KEY, MILVUS_TOKEN)
#
# 실행: kubectl apply -f k8s/bench-jobs.yaml   # PVC + 3개 retrieval Job 동시 생성
# 삭제: kubectl delete job bench-retrieval-hcp bench-retrieval-m3 bench-retrieval-qwen3
# 로그: kubectl logs job/bench-retrieval-hcp  (검색된 top-100 id 전체가 로그에 찍힘)
# 결과를 로컬로 자동 복사: ./k8s/fetch-results.ps1 -Stage retrieval  (Job 완료까지 대기 후 results/에 저장)
#
# retrieval 결과는 PVC(bench-results)에 남아있는 한 재사용됩니다 — 이미 저장된 모델은
# retrieval_runner.py가 자동으로 재검색을 스킵합니다.

# ── 결과 공유용 PVC (retrieval 3개 Job이 동시에 마운트 → ReadWriteMany 필수) ─────────
# ReadWriteOnce(Azure Disk 등)로 하면 동시 실행되는 Job들이 볼륨 attach를 기다리며 멈춥니다.
# nfs.csi.k8s.io 기반 StorageClass(RWX 지원) 사용. 클러스터마다 이름이 다르니
# `kubectl get storageclass`로 provisioner가 nfs.csi.k8s.io인 이름을 확인해 교체하세요.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bench-results
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-1mb-test
  resources:
    requests:
      storage: 5Gi
---
# ── 1. Retrieval: HCP-LLM-Latest ─────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: bench-retrieval-hcp
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: bench
          image: ghcr.io/seongwonm/ard-milvus:2320623e71762a1c8bf6acfa6f75e5a219d5d61b
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              python -m milvus_migration.bench.retrieval_runner \
                --data-root /data \
                --out /results/retrieval
          env:
            - name: MILVUS_URI
              value: "http://milvus:19530"
            - name: EMBEDDING_MODEL
              value: "HCP-LLM-Latest"
            - name: EMBEDDING_BATCH_SIZE
              value: "512"
            - name: EMBEDDING_TIMEOUT
              value: "300"
            - name: EMBEDDING_API_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: milvus-migration-secret
                  key: EMBEDDING_API_ENDPOINT
            - name: EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: milvus-migration-secret
                  key: EMBEDDING_API_KEY
            - name: MILVUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: milvus-migration-secret
                  key: MILVUS_TOKEN
          volumeMounts:
            - name: bench-results
              mountPath: /results
          resources:
            requests:
              cpu: "250m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: bench-results
          persistentVolumeClaim:
            claimName: bench-results
---

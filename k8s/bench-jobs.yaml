# Retrieval 3모델(HCP-LLM-Latest / bge-m3 / Qwen3-Embedding-8B) 벤치마크 Job
# Reranking은 k8s/rerank-job-bge.yaml, k8s/rerank-job-qwen3.yaml — 이 Job들이 모두 끝난 뒤 별도 적용하세요.
# Secret: milvus-migration-secret (EMBEDDING_API_ENDPOINT, EMBEDDING_API_KEY, MILVUS_TOKEN)
#
# PVC(bench-results)는 k8s/bench-results-pvc.yaml로 분리되어 있습니다 — retrieval/rerank Job이
# 모두 이 PVC를 공유 마운트하므로, retrieval을 안 돌리고 rerank만(로컬에 이미 있는 top100
# 결과를 주입해서) 돌리는 경우에도 이 PVC만 먼저 떠 있으면 됩니다.
#
# 실행:
#   kubectl apply -f k8s/bench-results-pvc.yaml   # 먼저 PVC 생성 (한 번만 하면 됨)
#   kubectl apply -f k8s/bench-jobs.yaml           # 3개 retrieval Job 생성
# 삭제: kubectl delete job bench-retrieval-hcp bench-retrieval-m3 bench-retrieval-qwen3
# 로그: kubectl logs job/bench-retrieval-hcp  (검색된 top-100 id 전체가 로그에 찍힘)
# 결과를 로컬로 자동 복사: ./k8s/fetch-results.ps1 -Stage retrieval  (Job 완료까지 대기 후 results/에 저장)
#
# retrieval 결과는 PVC(bench-results)에 남아있는 한 재사용됩니다 — 이미 저장된 모델은
# retrieval_runner.py가 자동으로 재검색을 스킵합니다.
# 인덱싱 속도를 다시 재고 싶으면 해당 Job의 REINDEX 값을 "true"로 바꾼 뒤
# (Job은 재적용 전 delete 필요) kubectl apply 하세요.

# ── 1. Retrieval: HCP-LLM-Latest ─────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: bench-retrieval-hcp
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: bench
          image: ghcr.io/seongwonm/ard-milvus:bb266f13a405523712b9f60c393577a0734612e1
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              ARGS="--data-root /data --out /results/retrieval"
              if [ "$REINDEX" = "true" ]; then ARGS="$ARGS --reindex"; fi
              python -m milvus_migration.bench.retrieval_runner $ARGS
          env:
            - name: MILVUS_URI
              value: "http://milvus:19530"
            - name: REINDEX
              value: "false"   # true로 바꾸면 인덱스가 있어도 강제 재색인 (인덱싱 속도 재측정용)
            - name: EMBEDDING_MODEL
              value: "HCP-LLM-Latest"
            - name: EMBEDDING_BATCH_SIZE
              value: "512"
            - name: EMBEDDING_TIMEOUT
              value: "300"
            - name: EMBEDDING_API_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: milvus-migration-secret
                  key: EMBEDDING_API_ENDPOINT
            - name: EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: milvus-migration-secret
                  key: EMBEDDING_API_KEY
            - name: MILVUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: milvus-migration-secret
                  key: MILVUS_TOKEN
          volumeMounts:
            - name: bench-results
              mountPath: /results
          resources:
            requests:
              cpu: "250m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: bench-results
          persistentVolumeClaim:
            claimName: bench-results
---

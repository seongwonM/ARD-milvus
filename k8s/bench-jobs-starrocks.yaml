# k8s/bench-jobs.yaml과 동일한 retrieval 3모델 벤치마크를 StarRocks 백엔드로 돌리는 Job.
# k8s/starrocks.yaml(StarRocks Pod)과 k8s/bench-results-pvc.yaml의 PVC(bench-results)가
# 먼저 떠 있어야 한다 — PVC는 여기서 다시 만들지 않고 그대로 재사용(rerank-job-bge.yaml/rerank-job-qwen3-top*.yaml과 동일 패턴).
#
# 실행:
#   kubectl apply -f k8s/starrocks.yaml
#   kubectl wait --for=condition=Ready pod/starrocks --timeout=300s
#   kubectl apply -f k8s/bench-jobs-starrocks.yaml
# 결과는 /results/retrieval-starrocks (Milvus 쪽 /results/retrieval과 분리 — 같은 모델명이라도
# 파일이 겹치지 않게 하기 위함).
# 삭제: kubectl delete job bench-retrieval-hcp-starrocks bench-retrieval-m3-starrocks bench-retrieval-qwen3-starrocks
apiVersion: batch/v1
kind: Job
metadata:
  name: bench-retrieval-hcp-starrocks
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: bench
          image: ghcr.io/seongwonm/ard-milvus:a4780e15b6275a64c41cf30774b02c37d5f302f3
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              ARGS="--data-root /data --out /results/retrieval-starrocks"
              if [ "$REINDEX" = "true" ]; then ARGS="$ARGS --reindex"; fi
              python -m milvus_migration.bench.retrieval_runner $ARGS
          env:
            - name: VECTOR_BACKEND
              value: "starrocks"
            - name: STARROCKS_HOST
              value: "starrocks"
            - name: REINDEX
              value: "false"
            - name: EMBEDDING_MODEL
              value: "HCP-LLM-Latest"
            - name: EMBEDDING_BATCH_SIZE
              value: "512"
            - name: EMBEDDING_TIMEOUT
              value: "300"
            - name: EMBEDDING_API_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: milvus-migration-secret
                  key: EMBEDDING_API_ENDPOINT
            - name: EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: milvus-migration-secret
                  key: EMBEDDING_API_KEY
          volumeMounts:
            - name: bench-results
              mountPath: /results
          resources:
            requests:
              cpu: "250m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: bench-results
          persistentVolumeClaim:
            claimName: bench-results
